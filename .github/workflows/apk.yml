name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Montar o projeto e gerar o APK
        run: |
          set -e
          if [ -f package.json ]; then
            PROJ="$PWD"
          else
            ZIP=$(ls *.zip | head -n 1)
            mkdir -p /tmp/proj
            unzip -q "$ZIP" -d /tmp/proj
            PROJ=$(dirname "$(find /tmp/proj -name package.json -not -path '*/node_modules/*' | head -n 1)")
          fi
          cd "$PROJ"
          npm install
          node build.js
          npx cap add android
          node scripts/android-setup.js
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/orbit.apk"

      - name: Publicar o APK para baixar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "apk-${{ github.run_number }}" orbit.apk --title "Orbit ${{ github.run_number }}" --notes "APK pronto para instalar"
